[project]
name = "claude-code-bus"
version = "1.0.0"
description = "Async message bus for Claude Code sessions sharing one machine"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
ccbus = "ccbus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8"]
